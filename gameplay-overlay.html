<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><title>Gameplay Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ice:#f2efe8;--steel:#a89a96;--deep:#070304;--hot:#c42a31}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;font-family:'Barlow Semi Condensed',Segoe UI,sans-serif;color:var(--ice)}
canvas{position:absolute;inset:0}
.fog{position:absolute;width:3840px;height:1080px;left:0;opacity:.18;background:radial-gradient(ellipse 30% 40% at 20% 60%,#8fb6c8,transparent 70%),radial-gradient(ellipse 25% 35% at 70% 40%,#5d7c8c,transparent 70%);filter:blur(60px);animation:fog 120s linear infinite}
.fog.f2{opacity:.1;animation-duration:180s;animation-direction:reverse;top:200px}
@keyframes fog{to{transform:translateX(-1920px)}}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.85) 100%)}
.frost{position:absolute;inset:0;opacity:.05;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='4'/><feColorMatrix values='0 0 0 0 .8 0 0 0 0 .9 0 0 0 0 1 0 0 0 1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.tag{font-weight:200;letter-spacing:1.1em;font-size:18px;color:var(--steel);text-transform:uppercase;margin-bottom:34px;padding-left:1.1em}
h1{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:150px;letter-spacing:.12em;line-height:1;color:#f2efe8;text-shadow:0 0 40px rgba(170,215,235,.25),0 0 2px rgba(255,255,255,.6);animation:breath 9s ease-in-out infinite}
@keyframes breath{0%,100%{opacity:.85;letter-spacing:.12em}50%{opacity:1;letter-spacing:.135em}}
.line{width:0;height:1px;margin:46px auto;background:linear-gradient(90deg,transparent,var(--ice),transparent);animation:grow 4s ease forwards}
@keyframes grow{to{width:640px}}
.sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;font-size:40px;color:var(--steel);letter-spacing:.04em}
.big{font-weight:200;font-size:46px;margin-top:30px;letter-spacing:.3em;font-variant-numeric:tabular-nums;color:var(--ice)}
.foot{position:absolute;bottom:52px;width:100%;text-align:center;font-weight:200;font-size:18px;letter-spacing:.6em;color:var(--steel);opacity:.6}
</style></head><body>

<style>
.c{position:absolute;width:46px;height:46px;border-color:rgba(196,42,49,.8);border-style:solid;border-width:0}
.tl{top:22px;left:22px;border-top-width:3px;border-left-width:3px}.tr{top:22px;right:22px;border-top-width:3px;border-right-width:3px}
.bl{bottom:22px;left:22px;border-bottom-width:3px;border-left-width:3px}.br{bottom:22px;right:22px;border-bottom-width:3px;border-right-width:3px}
.badge{position:absolute;top:34px;left:84px;display:flex;align-items:center;gap:14px;font-weight:200;font-size:15px;letter-spacing:.5em;color:var(--ice);text-shadow:0 0 12px rgba(0,0,0,.9)}
.dot{width:7px;height:7px;border-radius:50%;background:#bfe6f7;box-shadow:0 0 10px #9fd8ef;animation:p 3s ease-in-out infinite}
@keyframes p{50%{opacity:.25}}
.name{font-family:'Cormorant Garamond',serif;font-style:italic;letter-spacing:.15em;font-size:22px;font-weight:300}
.clock{position:absolute;top:34px;right:84px;font-weight:200;font-size:15px;letter-spacing:.4em;color:var(--steel);text-shadow:0 0 12px rgba(0,0,0,.9)}
</style>
<div class="c tl"></div><div class="c tr"></div><div class="c bl"></div><div class="c br"></div>



<style>
.promo{position:absolute;right:-600px;top:44%;width:520px;padding:26px 30px 28px 34px;background:linear-gradient(135deg,rgba(10,4,5,.95),rgba(28,7,9,.9));border-left:4px solid var(--hot);box-shadow:0 0 60px rgba(0,0,0,.6),inset 0 0 40px rgba(196,42,49,.06);transition:right 1.4s cubic-bezier(.22,.9,.25,1),opacity 1.4s;opacity:0}
.promo.on{right:0;opacity:1}
.promo .ad{position:absolute;top:10px;right:16px;font-size:11px;letter-spacing:.35em;color:var(--steel);opacity:.8}
.promo .k{font-weight:200;font-size:13px;letter-spacing:.6em;color:var(--steel);margin-bottom:12px}
.promo .t{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:46px;letter-spacing:.03em;text-transform:uppercase;color:#f2efe8;line-height:1.05}
.promo .u{margin-top:10px;font-weight:200;font-size:17px;letter-spacing:.2em;color:var(--ice);opacity:.85}
.promo::before{content:'';position:absolute;left:0;top:0;height:1px;width:0;background:linear-gradient(90deg,var(--hot),transparent);transition:width 2.2s ease .6s}
.promo.on::before{width:100%}
.btn{position:relative;display:inline-flex;align-items:center;gap:12px;margin-top:20px;padding:12px 26px;border:1px solid rgba(196,42,49,.85);background:rgba(196,42,49,.14);
     font-weight:700;font-size:17px;letter-spacing:.25em;color:#f2efe8;text-transform:uppercase;transition:transform .15s ease,background .6s ease,border-color .6s ease,box-shadow .6s}
.btn svg{width:18px;height:18px;transition:fill .4s;fill:transparent;stroke:#f2efe8;stroke-width:1.6}
.btn.press{transform:scale(.93)}
.btn.done{background:rgba(196,42,49,.5);border-color:#e04048;box-shadow:0 0 28px rgba(196,42,49,.5)}
.btn.done svg{fill:#f2efe8}
.ring{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border:1px solid #e04048;border-radius:50%;opacity:.9;animation:ring .9s ease-out forwards;pointer-events:none}
@keyframes ring{to{width:180px;height:180px;margin:-90px;opacity:0}}
.flake{position:absolute;left:50%;top:50%;width:4px;height:4px;border-radius:50%;background:#f2efe8;box-shadow:0 0 6px #c42a31;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) scale(.3);opacity:0}}
#cur{position:absolute;width:30px;height:30px;left:2100px;top:900px;opacity:0;transition:left 1.2s cubic-bezier(.4,0,.2,1),top 1.2s cubic-bezier(.4,0,.2,1),opacity .5s,transform .12s;filter:drop-shadow(0 2px 6px rgba(0,0,0,.7));z-index:9}
#cur.click{transform:scale(.82)}
</style>
<div class="promo" id="promo"><div class="ad" id="ad"></div><div class="k" id="k"></div><div class="t" id="t"></div><div class="u" id="u"></div>
<div class="btn" id="btn"><svg viewBox="0 0 24 24" id="ico"></svg><span id="bt"></span></div></div>
<svg id="cur" viewBox="0 0 24 24"><path d="M4 2l15 9.5-6.6 1.4 3.8 7.6-2.9 1.4-3.8-7.6L4 19z" fill="#f4fbfe" stroke="#0b1014" stroke-width="1.2" stroke-linejoin="round"/></svg>
<script>
/* ===== Einstellungen: Texte, Abstand, Dauer ===== */
const ALLE_MINUTEN = 25;      // wie oft
const ERSTES_MAL_NACH = 10;   // Minuten nach Szenenstart
const SICHTBAR_SEKUNDEN = 12;
const MELDUNGEN = [
  {werbung:false, klein:'FAMILIE', titel:'Folgen nicht vergessen', unten:'twitch.tv/esel_99', knopf:'Folgen', danach:'Gefolgt', icon:'herz'},
  {werbung:false, klein:'SUPPORT', titel:'Subscribe', unten:'twitch.tv/subs/esel_99', knopf:'Abonnieren', danach:'Danke', icon:'stern'},
];
const ICONS={herz:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
 tasche:'<path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2"/>',tuer:'<path d="M6 3h12v18H6zM14 12h.01"/>',
 stern:'<path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/>'};
let i=0;const el=id=>document.getElementById(id),box=el('promo'),btn=el('btn'),cur=el('cur');
const W=ms=>new Promise(r=>setTimeout(r,ms));
async function zeig(){
  const m=MELDUNGEN[i++%MELDUNGEN.length];
  el('ad').textContent=m.werbung?'WERBUNG':'';el('k').textContent=m.klein;el('t').textContent=m.titel;el('u').textContent=m.unten;
  el('bt').textContent=m.knopf;el('ico').innerHTML=ICONS[m.icon];btn.classList.remove('done');
  box.classList.add('on'); await W(1900);
  const r=btn.getBoundingClientRect();
  cur.style.transition='none';cur.style.left='2000px';cur.style.top='980px';cur.getBoundingClientRect();
  cur.style.transition='';cur.style.opacity=1;cur.style.left=(r.left+r.width*0.62)+'px';cur.style.top=(r.top+r.height*0.45)+'px';
  await W(1400);
  cur.classList.add('click');btn.classList.add('press');await W(140);
  cur.classList.remove('click');btn.classList.remove('press');btn.classList.add('done');el('bt').textContent=m.danach;
  const ring=document.createElement('div');ring.className='ring';btn.appendChild(ring);setTimeout(()=>ring.remove(),1000);
  for(let k=0;k<14;k++){const f=document.createElement('div');f.className='flake';const a=Math.random()*6.28,d=50+Math.random()*70;
    f.style.setProperty('--x',Math.cos(a)*d+'px');f.style.setProperty('--y',Math.sin(a)*d+'px');btn.appendChild(f);setTimeout(()=>f.remove(),1200)}
  await W(900);cur.style.left=(r.left+r.width+160)+'px';cur.style.top=(r.top+220)+'px';cur.style.opacity=0;
  await W(SICHTBAR_SEKUNDEN*1000-4400);box.classList.remove('on');
}
setTimeout(()=>{zeig();setInterval(zeig,ALLE_MINUTEN*60000)},ERSTES_MAL_NACH*60000);
</script>
</body></html>
