<!-- Esel_99 Spenden-Alert für Tipeee (Alert Box V2, </>-Element). Gleiche Karte wie das StreamElements-Widget, nur CSS. -->
<style>
  @import url("https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:wght@500;700&display=swap");
  .e99 { --hot: #c42a31; --text: #f2efe8; --muted: #a89a96; position: absolute; inset: 0; display: flex; justify-content: center; align-items: flex-start; padding-top: 150px; }
  .e99 .alert { position: relative; display: flex; min-width: 560px; max-width: 900px; overflow: hidden; background: linear-gradient(100deg, rgba(7,3,4,.96), rgba(28,7,9,.93));
    box-shadow: 0 18px 60px rgba(0,0,0,.6), 0 0 0 1px rgba(242,239,232,.06); opacity: 0;
    animation: drop-in .65s cubic-bezier(.2,.9,.25,1.15) forwards, drop-out .5s 6.4s ease-in forwards; }
  .e99 .bar { width: 7px; flex: none; background: var(--hot); box-shadow: 0 0 24px rgba(196,42,49,.7); animation: pulse 1.6s 1.2s ease-in-out infinite; }
  .e99 .body { position: relative; z-index: 1; padding: 22px 40px 24px 30px; display: grid; gap: 6px; }
  .e99 .kicker { font: 700 18px/1 "Barlow Semi Condensed", sans-serif; letter-spacing: .45em; color: var(--hot); animation: reveal .6s .2s ease-out both; }
  .e99 .name { font: 400 68px/1 Anton, Impact, sans-serif; letter-spacing: .02em; color: var(--text); text-shadow: 0 4px 24px rgba(0,0,0,.6); white-space: nowrap; animation: name-in .7s .15s cubic-bezier(.2,.9,.25,1) both; }
  .e99 .line { font: 500 24px/1.25 "Barlow Semi Condensed", sans-serif; color: var(--muted); }
  .e99 .line b { color: var(--text); font-weight: 700; }
  .e99 .alert::after { content: ""; position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: linear-gradient(90deg, var(--hot), rgba(196,42,49,0)); transform: scaleX(0); transform-origin: left; animation: sweep 1.2s .35s ease forwards; }
  .e99 .alert::before { content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none; background: linear-gradient(105deg, transparent 35%, rgba(242,239,232,.14) 50%, transparent 65%); transform: translateX(-120%); animation: shine 1.1s .75s ease-out forwards; }
  @keyframes drop-in { from { opacity: 0; transform: translateY(-40px); } to { opacity: 1; transform: none; } }
  @keyframes drop-out { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(-24px); } }
  @keyframes sweep { to { transform: scaleX(1); } }
  @keyframes shine { to { transform: translateX(120%); } }
  @keyframes reveal { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes name-in { from { opacity: 0; letter-spacing: .3em; } to { opacity: 1; letter-spacing: .02em; } }
  @keyframes pulse { 50% { box-shadow: 0 0 6px rgba(196,42,49,.3); filter: brightness(.75); } }
</style>
<div class="e99">
  <div class="alert">
    <div class="bar"></div>
    <div class="body">
      <div class="kicker">SPENDE</div>
      <div class="name">{username}</div>
      <div class="line">legt <b>{amount}</b> auf den Tisch. Die Familie dankt.</div>
    </div>
  </div>
</div>
