<!doctype html>
<!-- Twitch-Offline-Bild (Video-Player-Banner) für Esel_99, 1920x1080: Foto-Streifen wie Banner, Schriftzug mittig -->
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:wght@500;700&display=block">
<style>
  :root { --hot: #c42a31; --text: #f2efe8; --muted: #a89a96; }
  html, body { margin: 0; background: #070304; overflow: hidden; }
  .stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; color: var(--text); background: #070304; }
  .strips { position: absolute; inset: 0; display: flex; gap: 8px; }
  .strips div { flex: 1; background-size: cover; background-position: center 30%; filter: brightness(.4) contrast(1.1); }
  .shade { position: absolute; inset: 0; background: radial-gradient(55% 70% at 50% 50%, rgba(7,3,4,.6), rgba(7,3,4,.94)); }
  .copy { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 22px; text-align: center; }
  .kicker { font: 700 30px/1 "Barlow Semi Condensed", sans-serif; letter-spacing: .5em; margin-right: -.5em; color: var(--hot); }
  h1 { margin: 0; font: 400 190px/.95 Anton, Impact, sans-serif; letter-spacing: .02em; text-shadow: 0 10px 50px rgba(0,0,0,.7); }
  .bar { width: 120px; height: 5px; background: var(--hot); box-shadow: 0 0 24px rgba(196,42,49,.6); }
  .line { font: 500 38px/1 "Barlow Semi Condensed", sans-serif; color: var(--muted); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; mix-blend-mode: overlay; opacity: .4; }
</style>
<div class="stage">
  <div class="strips"><div style="background-image:url(../bilder/voll-maske.png)"></div><div style="background-image:url(../bilder/voll-tuch.png)"></div><div style="background-image:url(../bilder/voll-auto.png)"></div></div>
  <div class="shade"></div>
  <div class="copy"><span class="kicker">ESEL_99</span><h1>NICHT LIVE</h1><div class="bar"></div><span class="line">Die Familie trifft sich bald wieder.</span></div>
  <canvas width="1920" height="1080"></canvas>
</div>
<script>
  const c = document.querySelector('canvas').getContext('2d'), img = c.createImageData(1920, 1080), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = 128 + (Math.random() - .5) * 80; d[i] = d[i + 1] = d[i + 2] = n; d[i + 3] = 255; }
  c.putImageData(img, 0, 0);
</script>
