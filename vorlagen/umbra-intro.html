<!doctype html>
<!-- UMBRA-Intro als Einzelbilder für ein GIF: ?t=0..1 (Fortschritt), ?v=karte (800x320, Willkommenskarte) | icon (512x512, Server-Icon).
     Kein CSS-Timing: jeder Zustand wird aus t berechnet, damit jedes Bild exakt gleich gerendert wird. -->
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300&display=block">
<style>
  html, body { margin: 0; background: #070304; overflow: hidden; }
  .stage { position: relative; overflow: hidden; background: radial-gradient(70% 90% at 50% 45%, #1a0709 0%, #0b0405 55%, #050203 100%); }
  svg.ring { position: absolute; inset: 0; width: 100%; height: 100%; }
  .word { position: absolute; left: 50%; top: 50%; display: flex; transform: translate(-50%, -62%); }
  .word span { font-family: Jost, sans-serif; font-weight: 300; color: #ece8e2; display: inline-block; }
  .bar { position: absolute; left: 50%; background: #c42a31; transform-origin: center; box-shadow: 0 0 14px rgba(196,42,49,.6); }
  .shine { position: absolute; inset: 0; background: linear-gradient(105deg, transparent 40%, rgba(242,239,232,.10) 50%, transparent 60%); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; mix-blend-mode: overlay; opacity: .3; }
</style>
<div class="stage" id="s"></div>
<script>
  const q = new URLSearchParams(location.search);
  const t = Math.min(1, Math.max(0, Number(q.get('t')) || 0));
  const icon = q.get('v') === 'icon';
  const [W, H] = icon ? [512, 512] : [800, 320];
  const ease = x => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
  const seg = (a, b) => ease((t - a) / (b - a));       // 0..1 innerhalb [a, b]

  const s = document.getElementById('s');
  s.style.cssText = `width:${W}px;height:${H}px`;
  const fs = icon ? 54 : 34, gap = fs * .62;
  const R = icon ? 225 : 138, C = 2 * Math.PI * R;
  const ringP = seg(0, .42);
  const letters = 'UMBRΛ'.split('').map((ch, i) => {
    const p = seg(.14 + i * .07, .44 + i * .07);
    return `<span style="font-size:${fs}px;margin-right:${i < 4 ? gap : 0}px;opacity:${p};transform:translateY(${(1 - p) * fs * .35}px);filter:blur(${(1 - p) * 4}px)">${ch}</span>`;
  }).join('');
  const barP = seg(.62, .82), barW = fs * .9, barH = Math.max(2, fs * .07);
  const shineP = seg(.8, 1);

  s.innerHTML = `
    <svg class="ring" viewBox="0 0 ${W} ${H}"><circle cx="${W / 2}" cy="${H / 2}" r="${R}" fill="none" stroke="rgba(200,196,190,.2)" stroke-width="1.4"
      stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - ringP)}" transform="rotate(-90 ${W / 2} ${H / 2})"/></svg>
    <div class="word">${letters}</div>
    <div class="bar" style="top:${H / 2 + fs * .62}px;width:${barW}px;height:${barH}px;margin-left:${-barW / 2}px;transform:scaleX(${barP});opacity:${barP ? 1 : 0}"></div>
    <div class="shine" style="transform:translateX(${-120 + shineP * 240}%)"></div>
    <canvas width="${W}" height="${H}"></canvas>`;

  // Filmkorn mit festem Startwert, damit es zwischen den Bildern nicht flimmert
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const c = s.querySelector('canvas').getContext('2d'), img = c.createImageData(W, H), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = 128 + (rnd() - .5) * 70; d[i] = d[i + 1] = d[i + 2] = n; d[i + 3] = 255; }
  c.putImageData(img, 0, 0);
</script>
