<!doctype html>
<!-- TipeeeStream-Grafiken für Esel_99: ?v=banner (1500x500, Foto-Streifen + "Tribut an die Familie") | avatar (800x800) -->
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:wght@500;700&display=block">
<style>
  :root { --hot: #c42a31; --text: #f2efe8; --muted: #a89a96; }
  html, body { margin: 0; background: #070304; overflow: hidden; }
  .stage { position: relative; overflow: hidden; color: var(--text); background: #070304; }
  .strips { position: absolute; inset: 0; display: flex; gap: 6px; }
  .strips div { flex: 1; background-size: cover; background-position: center 30%; filter: brightness(.42) contrast(1.1); }
  .shade { position: absolute; inset: 0; background: radial-gradient(60% 90% at 50% 50%, rgba(7,3,4,.55), rgba(7,3,4,.92)); }
  .copy { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; text-align: center; }
  .kicker { font: 700 22px/1 "Barlow Semi Condensed", sans-serif; letter-spacing: .5em; margin-right: -.5em; color: var(--hot); }
  h1 { margin: 0; font: 400 112px/.95 Anton, Impact, sans-serif; letter-spacing: .02em; text-shadow: 0 8px 40px rgba(0,0,0,.7); }
  .line { font: 500 26px/1 "Barlow Semi Condensed", sans-serif; color: var(--muted); }
  .bar { width: 90px; height: 4px; background: var(--hot); }
  .avatar { position: absolute; inset: 0; background: url(../bilder/voll-tuch.png) 52% 38% / 150% auto no-repeat; filter: brightness(.85) contrast(1.05); }
  .ring { position: absolute; inset: 34px; border-radius: 50%; border: 7px solid var(--hot); box-shadow: 0 0 40px rgba(196,42,49,.45), inset 0 0 40px rgba(196,42,49,.3); }
  .vig { position: absolute; inset: 0; background: radial-gradient(50% 50% at 50% 48%, rgba(7,3,4,0) 55%, rgba(7,3,4,.75) 100%); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; mix-blend-mode: overlay; opacity: .4; }
  /* Tipeee-Cover: Profilbild, Name und Menü liegen links/mittig drüber → dort dunkel, Fotos rechts, kein Schriftzug */
  .cover .strips div { filter: brightness(.55) contrast(1.1); }
  .cover .shade { background: linear-gradient(90deg, #070304 0%, rgba(7,3,4,.97) 30%, rgba(7,3,4,.75) 52%, rgba(7,3,4,.35) 78%, rgba(7,3,4,.55) 100%),
      linear-gradient(180deg, rgba(7,3,4,.35), rgba(7,3,4,0) 40%, rgba(7,3,4,.85)); }
  .cover .line-red { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: linear-gradient(90deg, rgba(196,42,49,0), #c42a31 30%, #c42a31 70%, rgba(196,42,49,0)); }
  .cover .mark { position: absolute; right: 60px; top: 46px; font: 700 18px/1 "Barlow Semi Condensed", sans-serif; letter-spacing: .5em; color: rgba(242,239,232,.55); }
</style>
<div class="stage" id="s"></div>
<script>
  const v = new URLSearchParams(location.search).get('v') || 'banner';
  const s = document.getElementById('s');
  const q = new URLSearchParams(location.search); const W = Number(q.get('w')) || (v === 'avatar' ? 800 : 1500), H = Number(q.get('h')) || (v === 'avatar' ? 800 : 500);
  s.style.cssText = `width:${W}px;height:${H}px`;
  if (v === 'cover') s.classList.add('cover');
  s.innerHTML = v === 'cover'
    ? `<div class="strips"><div style="background-image:url(../bilder/voll-tuch.png)"></div><div style="background-image:url(../bilder/voll-maske.png)"></div><div style="background-image:url(../bilder/voll-auto.png)"></div></div>
       <div class="shade"></div><div class="mark">TRIBUT · FREIWILLIG</div><div class="line-red"></div><canvas></canvas>`
    : v === 'banner'
    ? `<div class="strips"><div style="background-image:url(../bilder/voll-maske.png)"></div><div style="background-image:url(../bilder/voll-tuch.png)"></div><div style="background-image:url(../bilder/voll-auto.png)"></div></div>
       <div class="shade"></div>
       <div class="copy"><span class="kicker">ESEL_99</span><h1>TRIBUT AN DIE FAMILIE</h1><div class="bar"></div><span class="line">Freiwillig. Nie erwartet. Nie vergessen.</span></div><canvas></canvas>`
    : `<div class="avatar"></div><div class="vig"></div><div class="ring"></div><canvas></canvas>`;
  const cv = s.querySelector('canvas'); cv.width = W; cv.height = H;
  const c = cv.getContext('2d'), img = c.createImageData(W, H), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = 128 + (Math.random() - .5) * 80; d[i] = d[i + 1] = d[i + 2] = n; d[i + 3] = 255; }
  c.putImageData(img, 0, 0);
</script>
