<!doctype html>
<!-- Discord-Profilbanner für Esel_99, 960x384 (5:2), nur Fotos ohne Schrift. Links unten liegt das Profilbild drüber, dort bleibt es dunkel. -->
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:wght@500;700&family=Jost:wght@400&display=block">
<style>
  html, body { margin: 0; background: #070304; overflow: hidden; }
  .stage { position: relative; width: 960px; height: 384px; overflow: hidden; color: #f2efe8; background: #070304; }
  .strips { position: absolute; inset: 0; display: flex; gap: 5px; }
  .strips div { flex: 1; background-size: cover; background-position: center 30%; filter: brightness(.55) contrast(1.1); }
  .shade { position: absolute; inset: 0; background:
    linear-gradient(90deg, rgba(7,3,4,.92) 0%, rgba(7,3,4,.55) 38%, rgba(7,3,4,.25) 70%, rgba(7,3,4,.6) 100%),
    linear-gradient(180deg, rgba(7,3,4,.2), rgba(7,3,4,0) 45%, rgba(7,3,4,.9)); }
  .copy { position: absolute; right: 44px; top: 50%; transform: translateY(-50%); display: grid; justify-items: end; gap: 10px; text-align: right; }
  .kicker { font: 700 16px/1 "Barlow Semi Condensed", sans-serif; letter-spacing: .5em; margin-right: -.5em; color: #c42a31; }
  h1 { margin: 0; font: 400 86px/.9 Anton, Impact, sans-serif; letter-spacing: .02em; text-shadow: 0 6px 30px rgba(0,0,0,.7); }
  .umbra { display: grid; justify-items: end; gap: 7px; font: 400 15px/1 Jost, sans-serif; letter-spacing: .6em; margin-right: -.6em; color: rgba(242,239,232,.75); }
  .umbra i { display: block; width: 26px; height: 2px; background: #c42a31; margin-right: .6em; }
  .line { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: linear-gradient(90deg, rgba(196,42,49,0), #c42a31 35%, #c42a31 65%, rgba(196,42,49,0)); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; mix-blend-mode: overlay; opacity: .4; }
</style>
<div class="stage">
  <div class="strips"><div style="background-image:url(../bilder/voll-maske.png)"></div><div style="background-image:url(../bilder/voll-tuch.png)"></div><div style="background-image:url(../bilder/voll-auto.png)"></div></div>
  <div class="shade"></div>
  <div class="line"></div>
  <canvas width="960" height="384"></canvas>
</div>
<script>
  const c = document.querySelector('canvas').getContext('2d'), img = c.createImageData(960, 384), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = 128 + (Math.random() - .5) * 80; d[i] = d[i + 1] = d[i + 2] = n; d[i + 3] = 255; }
  c.putImageData(img, 0, 0);
</script>
