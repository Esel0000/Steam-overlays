<!doctype html>
<!-- Eigene Figur für Esel_99: Esel im Stil klassischer Twitch-Reaktions-Emotes (flache Farben, dicke Kontur,
     große Augen mit Lidern), rotes Halstuch als Verbindung zum UMBRA-Rot. Jede Kachel 112x112. -->
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  .row { display: flex; } .e { width: 112px; height: 112px; }
  svg { display: block; width: 100%; height: 100%; }
</style>
<div class="row" id="r"></div>
<script>
  const INK = '#17171c', FUR = '#9ba1aa', FUR_D = '#7d838c', EAR_IN = '#c9a7a3', MUZ = '#ddd6cb', RED = '#c42a31', LIP = '#b9827d';
  const lw = 'stroke="' + INK + '" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"';

  // Grundkopf: Ohren, Mähne, Kopf, Halstuch, Schnauze mit Nüstern
  function head(extraBehind = '') {
    return `${extraBehind}
      <path d="M30 40C22 26 20 10 27 4c7 4 12 20 13 32z" fill="${FUR}" ${lw}/><path d="M29 33c-4-9-5-18-1-24 4 4 7 14 8 22z" fill="${EAR_IN}"/>
      <path d="M70 40c8-14 10-30 3-36-7 4-12 20-13 32z" fill="${FUR}" ${lw}/><path d="M71 33c4-9 5-18 1-24-4 4-7 14-8 22z" fill="${EAR_IN}"/>
      <path d="M20 92c2-8 8-12 14-14h32c6 2 12 6 14 14z" fill="${RED}" ${lw}/>
      <ellipse cx="50" cy="50" rx="31" ry="29" fill="${FUR}" ${lw}/>
      <path d="M38 27l3-10 5 7 4-10 4 10 5-7 3 10q-12 5-24 0z" fill="${FUR_D}" ${lw}/>
      <ellipse cx="50" cy="73" rx="25" ry="16" fill="${MUZ}" ${lw}/>
      <ellipse cx="41" cy="69" rx="3" ry="2.2" fill="${INK}"/><ellipse cx="59" cy="69" rx="3" ry="2.2" fill="${INK}"/>`;
  }
  // Auge: Weiß, Pupille (dx/dy), Lid von oben (lid 0..1), Neigung des Lids (tilt, + = innen tiefer)
  function eye(cx, { lid = .45, tilt = 0, dx = 0, dy = 1, side = 1 } = {}) {
    const top = 42 - 9, h = 18 * lid, t = tilt * side;
    return `<ellipse cx="${cx}" cy="42" rx="10" ry="9" fill="#fff" ${lw}/>
      <circle cx="${cx + dx}" cy="${43 + dy}" r="4.2" fill="${INK}"/>
      <clipPath id="c${cx}${lid}${tilt}"><ellipse cx="${cx}" cy="42" rx="10" ry="9"/></clipPath>
      <path clip-path="url(#c${cx}${lid}${tilt})" d="M${cx - 12} ${top - 2}H${cx + 12}V${top + h - t}L${cx - 12} ${top + h + t}z" fill="${FUR_D}"/>
      <path d="M${cx - 10} ${top + h + t}L${cx + 10} ${top + h - t}" ${lw} fill="none"/>`;
  }
  const eyes = o => eye(37, { ...o, side: 1 }) + eye(63, { ...o, side: -1 });

  const E = {
    // Hallo: entspannt, leichtes Grinsen
    Hi: head() + eyes({ lid: .42 }) + `<path d="M40 80q10 6 20 0" fill="none" ${lw}/>`,
    // Pog: Augen weit auf, Mund weit offen
    Pog: head() + eyes({ lid: 0, dy: 0 }) + `<ellipse cx="50" cy="80" rx="9" ry="8" fill="#5a1f22" ${lw}/><ellipse cx="50" cy="84" rx="5" ry="3" fill="#e0707a"/>`,
    // Sad: Lider schwer und nach außen hängend, Mund nach unten
    Sad: head() + eyes({ lid: .55, tilt: 4, dy: 2 }) + `<path d="M40 84q10-7 20 0" fill="none" ${lw}/>`,
    // Cry: wie Sad mit Tränen
    Cry: head() + eyes({ lid: .6, tilt: 4, dy: 2 }) + `<path d="M40 84q10-7 20 0" fill="none" ${lw}/>
      <path d="M31 51c0 6-4 9-4 13a4 4 0 0 0 8 0c0-4-4-7-4-13z" fill="#7cc4ff" ${lw}/><path d="M69 51c0 6-4 9-4 13a4 4 0 0 0 8 0c0-4-4-7-4-13z" fill="#7cc4ff" ${lw}/>`,
    // Mad: Lider schräg nach innen, Brauen, rote Wangen, zusammengekniffener Mund
    Mad: head() + eyes({ lid: .5, tilt: -5 }) + `<path d="M26 27l20 7M74 27l-20 7" ${lw} fill="none" stroke-width="4"/>
      <ellipse cx="27" cy="58" rx="6" ry="3.5" fill="${RED}" opacity=".55"/><ellipse cx="73" cy="58" rx="6" ry="3.5" fill="${RED}" opacity=".55"/>
      <path d="M41 82h18" ${lw}/>`,
    // Laugh: Augen zu (^^), Mund breit offen
    Laugh: head() + `<path d="M28 44q9-9 18 0M54 44q9-9 18 0" fill="none" ${lw} stroke-width="3.5"/>
      <path d="M36 77q14 16 28 0z" fill="#5a1f22" ${lw}/><path d="M42 84q8 4 16 0" fill="#e0707a"/>`,
    // Sus: Blick zur Seite, schiefes Grinsen
    Sus: head() + eyes({ lid: .55, dx: 5 }) + `<path d="M42 81q8 2 16-3" fill="none" ${lw}/>`,
    // Love: Herzaugen
    Love: head() + `<path d="M37 50l-9-9a5.5 5.5 0 0 1 9-6 5.5 5.5 0 0 1 9 6z" fill="${RED}" ${lw}/><path d="M63 50l-9-9a5.5 5.5 0 0 1 9-6 5.5 5.5 0 0 1 9 6z" fill="${RED}" ${lw}/>
      <path d="M40 80q10 7 20 0" fill="none" ${lw}/>`,
  };
  document.getElementById('r').innerHTML = Object.entries(E).map(([n, s]) => `<div class="e" data-name="${n}"><svg viewBox="0 0 100 100">${s}</svg></div>`).join('');
</script>
