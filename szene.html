<!doctype html>
<!-- OBS-Szenen für Esel_99 (1920x1080, Browser-Quelle mit "Lokale Datei").
     ?s=start (mit Countdown, ?min=5) | pause | ende -->
<meta charset="utf-8">
<title>Esel_99 · Szene</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:wght@500;700&display=swap">
<style>
  :root { --bg: #070304; --hot: #c42a31; --text: #f2efe8; --muted: #a89a96; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--text); }
  .strips { position: absolute; inset: 0; display: flex; gap: 8px; }
  .strips div { flex: 1; background-size: cover; background-position: center; filter: brightness(.4) contrast(1.1); animation: drift 40s ease-in-out infinite alternate; }
  .strips div:nth-child(2) { animation-delay: -13s; } .strips div:nth-child(3) { animation-delay: -26s; }
  @keyframes drift { from { transform: scale(1.04) translateY(-8px); } to { transform: scale(1.12) translateY(10px); } }
  .shade { position: absolute; inset: 0; background: radial-gradient(60% 70% at 50% 50%, rgba(7,3,4,.72), rgba(7,3,4,.92)); }
  .center { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 22px; text-align: center; }
  .kicker { font: 700 30px/1 "Barlow Semi Condensed", sans-serif; letter-spacing: .5em; margin-right: -.5em; color: var(--muted); }
  h1 { margin: 0; font: 400 190px/.95 Anton, Impact, sans-serif; letter-spacing: .02em; text-shadow: 0 10px 50px rgba(0,0,0,.7); }
  h1 em { font-style: normal; color: var(--hot); }
  .rule { width: 120px; height: 5px; background: var(--hot); animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; width: 180px; } }
  .count { font: 400 96px/1 Anton, Impact, sans-serif; letter-spacing: .06em; font-variant-numeric: tabular-nums; }
  .foot { position: absolute; left: 0; right: 0; bottom: 56px; text-align: center; font: 700 26px/1 "Barlow Semi Condensed", sans-serif; letter-spacing: .3em; color: var(--muted); }
  canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; mix-blend-mode: overlay; opacity: .45; pointer-events: none; }
</style>
<div class="strips"><div style="background-image:url(bilder/strip1.png)"></div><div style="background-image:url(bilder/strip2.png)"></div><div style="background-image:url(bilder/strip3.png)"></div></div>
<div class="shade"></div>
<div class="center" id="center"></div>
<div class="foot">TWITCH.TV/ESEL_99</div>
<canvas width="960" height="540"></canvas>
<script>
  const q = new URLSearchParams(location.search), s = q.get('s') || 'start';
  const TEXT = {
    start: ['ESEL_99', 'GLEICH<br>GEHT\'S <em>LOS</em>'],
    pause: ['KURZE PAUSE', 'BIN GLEICH<br><em>ZURÜCK</em>'],
    ende: ['DAS WAR\'S FÜR HEUTE', 'DANKE FÜRS<br><em>ZUSCHAUEN</em>'],
  }[s];
  document.getElementById('center').innerHTML = `<span class="kicker">${TEXT[0]}</span><h1>${TEXT[1]}</h1><div class="rule"></div>` + (s === 'start' ? '<div class="count" id="count"></div>' : '');

  // Countdown für "Gleich geht's los": ?min=5 (Standard 5 Minuten), danach "LIVE"
  if (s === 'start') {
    const end = Date.now() + (Number(q.get('min')) || 5) * 60000, el = document.getElementById('count');
    const tick = () => {
      const left = Math.max(0, Math.round((end - Date.now()) / 1000));
      el.textContent = left ? `${String(Math.floor(left / 60)).padStart(2, '0')}:${String(left % 60).padStart(2, '0')}` : 'LIVE';
    };
    tick(); setInterval(tick, 250);
  }

  // Bewegtes Filmkorn
  const c = document.querySelector('canvas').getContext('2d'), img = c.createImageData(960, 540), d = img.data;
  setInterval(() => {
    for (let i = 0; i < d.length; i += 4) { const n = 128 + (Math.random() - .5) * 100; d[i] = d[i + 1] = d[i + 2] = n; d[i + 3] = 255; }
    c.putImageData(img, 0, 0);
  }, 90);
</script>
